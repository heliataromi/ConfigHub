name: Hourly V2Ray Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Runs exactly at the top of every hour
  workflow_dispatch:     # Gives you a "Run workflow" button in the GitHub UI for manual testing

permissions:
  contents: write        # Crucial: allows the bot to push code back to your repo

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Scraper
        run: go run cmd/scraper/main.go

      - name: Push to Subscription Branch
        run: |
          # 1. Navigate into the output directory created by the Go script
          cd sub
          
          # 2. Initialize a brand new, empty Git repository inside the 'sub' folder
          git init
          git checkout -b subscription
          
          # 3. Configure the Git bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. Add the generated text files and commit them
          git add .
          git commit -m "Auto-update V2Ray configs: $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # 5. Force-push this fresh history to the 'subscription' branch on GitHub
          # This overwrites the old branch entirely, keeping only 1 commit in history!
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" subscription